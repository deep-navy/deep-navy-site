title: deep navy
tagline: Autonomous engineering, accountable outcomes
description: deep navy gives product teams a coordinated autonomous engineering team with explicit approvals, visible work, and transparent engineering economics.
url: https://deep.navy
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
permalink: pretty
author:
  name: deep navy
  url: https://deep.navy
logo: /assets/images/deep-navy-mark.svg
social:
  name: deep navy
  links:
    - https://github.com/deep-navy
plugins:
  - jekyll-feed
  - jekyll-sitemap
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og/default.png
      author: deep navy
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      og_type: article
  - scope:
      path: app
    values:
      layout: app
      sitemap: false
runtime:
  environment: local
  api_base_url: ""
  cognito_domain: ""
  cognito_client_id: ""
  cognito_callback_url: ""
  cognito_logout_url: ""
  oauth_scopes:
    - openid
    - email
    - profile
  plan_id: founding-team
  stripe_publishable_key: ""
  build_revision: local
exclude:
  - node_modules
  - src
  - tsconfig.json
  - package.json
  - package-lock.json
  - scripts
  - vendor
  - README.md
  - Gemfile
  - Gemfile.lock
  - _config.runtime.yml
