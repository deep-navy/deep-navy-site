name: Site

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Check generated API reference
        run: npm run check:api-docs
      - name: Check pinned generated API consumer
        run: npm run check:vendor
      - name: Type-check browser API client
        run: npm run typecheck
      - name: Build browser API client
        run: npm run build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check public runtime configuration validation
        run: ruby scripts/runtime_config_test.rb
      - name: Check browser JavaScript
        run: |
          node --check assets/js/site.js
          node --check assets/js/callback-scrubber.js
          node --check assets/js/platform-api-client.js
          node --check assets/js/organization-onboarding.js
          node --check assets/js/launch-contract.js
          node --check assets/js/app-state.js
          node --check assets/js/agent-roles.js
          node --check assets/js/app.js
      - name: Check onboarding contract flow
        run: npm test
      - name: Build static site
        run: bundle exec jekyll build --strict_front_matter
      - name: Check rendered HTML and links
        run: ruby scripts/check_site.rb _site

  deploy:
    # GitHub Pages has one deployment slot per repository. Keep it bound to
    # develop until the deliberate production cutover switches the custom
    # domain and deployment policy together.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: development
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Check generated API reference
        run: npm run check:api-docs
      - name: Build generated browser API client
        run: npm run build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # A hostname that does not resolve fails every call the app makes, and the
      # only symptom is that sign-in cannot start. Catch it before publishing
      # rather than in the browser.
      - name: Check the API base URL resolves
        env:
          SITE_API_BASE_URL: ${{ vars.SITE_API_BASE_URL }}
        run: npm run check:api-base-url
      - name: Write public environment configuration
        env:
          DEEP_NAVY_ENVIRONMENT: development
          # Pages can report the repository project URL while a custom-domain
          # certificate is still provisioning. Pin the environment's public
          # origin so Jekyll never emits repository-project paths in development.
          SITE_URL: https://dev.deep.navy
          SITE_API_BASE_URL: ${{ vars.SITE_API_BASE_URL }}
          SITE_COGNITO_DOMAIN: ${{ vars.SITE_COGNITO_DOMAIN }}
          SITE_COGNITO_CLIENT_ID: ${{ vars.SITE_COGNITO_CLIENT_ID }}
          SITE_COGNITO_CALLBACK_URL: ${{ vars.SITE_COGNITO_CALLBACK_URL }}
          SITE_COGNITO_LOGOUT_URL: ${{ vars.SITE_COGNITO_LOGOUT_URL }}
          SITE_PLAN_ID: ${{ vars.SITE_PLAN_ID || 'founding-team' }}
          SITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.SITE_STRIPE_PUBLISHABLE_KEY }}
        run: ruby scripts/write_runtime_config.rb
      - name: Build environment site
        env:
          JEKYLL_ENV: development
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_config.runtime.yml --baseurl ""
      - name: Check rendered deployment
        run: ruby scripts/check_site.rb _site ""
      - name: Assert the Pages custom domain
        # Actions-deployed Pages only keeps a custom domain bound if the published
        # artifact carries a CNAME file. Without it GitHub clears the domain on
        # each deploy, actions/configure-pages then reports the repository-project
        # base path (/deep-navy-site) — which bakes broken asset URLs into every
        # page — and the managed TLS certificate never provisions. Derive the host
        # from the pinned public origin so this stays a single source of truth.
        env:
          SITE_URL: https://dev.deep.navy
        run: printf '%s\n' "${SITE_URL#https://}" > _site/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
