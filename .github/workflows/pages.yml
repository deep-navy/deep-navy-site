name: Site

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Check pinned generated API consumer
        run: npm run check:vendor
      - name: Type-check browser API client
        run: npm run typecheck
      - name: Build browser API client
        run: npm run build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check public runtime configuration validation
        run: ruby scripts/runtime_config_test.rb
      - name: Check browser JavaScript
        run: |
          node --check assets/js/site.js
          node --check assets/js/callback-scrubber.js
          node --check assets/js/platform-api-client.js
          node --check assets/js/organization-onboarding.js
          node --check assets/js/launch-contract.js
          node --check assets/js/app.js
      - name: Check onboarding contract flow
        run: npm test
      - name: Build static site
        run: bundle exec jekyll build --strict_front_matter
      - name: Check rendered HTML and links
        run: ruby scripts/check_site.rb _site

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Build generated browser API client
        run: npm run build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write public environment configuration
        env:
          DEEP_NAVY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_API_BASE_URL: ${{ vars.SITE_API_BASE_URL }}
          SITE_COGNITO_DOMAIN: ${{ vars.SITE_COGNITO_DOMAIN }}
          SITE_COGNITO_CLIENT_ID: ${{ vars.SITE_COGNITO_CLIENT_ID }}
          SITE_COGNITO_CALLBACK_URL: ${{ vars.SITE_COGNITO_CALLBACK_URL }}
          SITE_COGNITO_LOGOUT_URL: ${{ vars.SITE_COGNITO_LOGOUT_URL }}
          SITE_PLAN_ID: ${{ vars.SITE_PLAN_ID }}
        run: ruby scripts/write_runtime_config.rb
      - name: Build environment site
        env:
          JEKYLL_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_config.runtime.yml --baseurl "${{ steps.pages.outputs.base_path }}"
      - name: Check rendered deployment
        run: ruby scripts/check_site.rb _site "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
