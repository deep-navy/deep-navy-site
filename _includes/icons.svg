     ladder is the only place severity is defined, so the glyph it names has to
     resolve here without a translation table in between: a local map from
     "the ladder says circle-x" to "this repo calls that something else" is a
     second opinion about severity, which is the one thing the ladder exists to
     prevent. octagon-alert is already above. Same 24 grid and stroke art as
