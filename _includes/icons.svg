{%- comment -%}
  One inline sprite. The design system's Icon component fetches each glyph from a CDN and
  inlines it; this site's CSP cannot reach a CDN, and a sprite costs no request either way.

  EVERY SHAPE IN HERE CARRIES pathLength="1", AND THAT IS LOAD-BEARING.

  The draw family (ds/components/core/icons-motion.css) animates stroke-dashoffset from the
  full path length down to zero, and it expresses that length as 1 — stroke-dasharray:1,
  stroke-dashoffset:1 -> 0. pathLength="1" is what makes 1 mean "the whole path": it tells
  the browser to scale every distance computation as if the path were one unit long.

  Without it, stroke-dasharray:1 is one user unit on a 24-unit grid, and the glyph renders
  as a crawling row of dots rather than a line drawing itself in. It fails as WRONG MOTION,
  not as no motion, which is why it gets a shout rather than a footnote. The design system
  does the same thing by rewriting each fetched SVG; a sprite has to author it.

  It is inert everywhere else: with no dash properties set, a pathLength changes nothing.
  So add it to any glyph added here, whatever family that glyph is expected to land in —
  icon-motion.js derives the family from the name, and the name can change.
{%- endcomment -%}
