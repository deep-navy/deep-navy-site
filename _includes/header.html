<header class="site-header" data-site-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="deep navy home">
      <span class="brand-mark" aria-hidden="true"><span>DN/</span></span>
      <span>deep navy</span>
    </a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="{{ '/product/' | relative_url }}"{% if page.url contains '/product/' %} aria-current="page"{% endif %}>Product</a>
      <a href="{{ '/solutions/' | relative_url }}"{% if page.url contains '/solutions/' %} aria-current="page"{% endif %}>Solutions</a>
      <a href="{{ '/economics/' | relative_url }}"{% if page.url contains '/economics/' %} aria-current="page"{% endif %}>Economics</a>
      <a href="{{ '/customers/' | relative_url }}"{% if page.url contains '/customers/' %} aria-current="page"{% endif %}>Customers</a>
      <a href="{{ '/pricing/' | relative_url }}"{% if page.url contains '/pricing/' %} aria-current="page"{% endif %}>Pricing</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Resources</a>
      <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs/' %} aria-current="page"{% endif %}>Docs</a>
      <a href="{{ '/security/' | relative_url }}"{% if page.url contains '/security/' %} aria-current="page"{% endif %}>Security</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-live="polite">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
        <span class="visually-hidden" data-theme-label>Theme: match system</span>
      </button>
      
      <a class="button button-primary button-small desktop-action" href="{{ '/app/?signin=1' | relative_url }}">Connect your repo</a>
      <details class="mobile-menu">
        <summary aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></summary>
        <nav aria-label="Mobile navigation">
          <a href="{{ '/product/' | relative_url }}">Product</a>
          <a href="{{ '/solutions/' | relative_url }}">Solutions</a>
          <a href="{{ '/economics/' | relative_url }}">Engineering Economics</a>
          <a href="{{ '/customers/' | relative_url }}">Customers</a>
          <a href="{{ '/pricing/' | relative_url }}">Pricing</a>
          <a href="{{ '/blog/' | relative_url }}">Resources</a>
          <a href="{{ '/docs/' | relative_url }}">Documentation</a>
          <a href="{{ '/security/' | relative_url }}">Security</a>
          <a href="{{ '/app/?signin=1' | relative_url }}">Sign in with GitHub</a>
          <a class="button button-primary" href="{{ '/app/?signin=1' | relative_url }}">Connect your repo</a>
        </nav>
      </details>
    </div>
  </div>
</header>
