<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://js.stripe.com; style-src 'self'; img-src 'self' data: https://*.stripe.com; font-src 'self'; connect-src 'self' {{ site.runtime.api_base_url | escape }} {{ site.runtime.cognito_domain | escape }} https://api.stripe.com https://checkout.stripe.com https://r.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; form-action 'self'; worker-src 'none'{% if site.runtime.environment == 'production' %}; upgrade-insecure-requests{% endif %}">
    <meta name="referrer" content="no-referrer">
    <script src="{{ '/assets/js/callback-scrubber.js' | relative_url }}"></script>
    {% include head.html %}
    <meta name="robots" content="noindex,nofollow,noarchive">
  </head>
  <body class="app-body" data-app-callback="{{ page.auth_callback | default: false }}" data-github-callback="{{ page.github_callback | default: false }}">
    <a class="skip-link" href="#app-main">Skip to application</a>
    <header class="app-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="deep navy home">
        <span class="brand-mark" aria-hidden="true"><span>DN/</span></span>
        <span>deep navy</span>
      </a>
      <nav class="app-primary-nav" aria-label="Workspace navigation" data-authenticated-nav hidden>
        <a href="#workspace-overview">Overview</a>
        <a href="#workspace-setup">Setup</a>
        <a href="#workspace-activity">Activity</a>
        <a href="#workspace-economics">Economics</a>
        <a href="#workspace-approvals">Approvals</a>
      </nav>
      <div class="app-header-actions">
        <span class="environment-pill" data-environment>Local</span>
        <span class="session-pill" data-session-state>Signed out</span>
        <button class="button button-quiet button-small" type="button" data-sign-out hidden>Sign out</button>
        <a class="button button-quiet button-small" href="{{ '/docs/' | relative_url }}">Help</a>
      </div>
    </header>
    <main id="app-main" tabindex="-1">{{ content }}</main>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast hidden></div>
    <script src="{{ '/assets/js/runtime-config.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/platform-api-client.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/organization-onboarding.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/launch-contract.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/app-state.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/agent-roles.js' | relative_url }}"></script>
    <script src="https://js.stripe.com/clover/stripe.js" defer></script>
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  </body>
</html>
