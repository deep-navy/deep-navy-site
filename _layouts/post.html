---
layout: default
---
<article>
  <header class="page-hero">
    <div class="shell">
      <span class="eyebrow">Field note</span>
      <h1>{{ page.title }}</h1>
      <p>{{ page.description }}</p>
      <div class="page-meta"><span>By {{ page.author | default: site.author.name }}</span><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.updated %}<span>Updated {{ page.updated | date: '%B %-d, %Y' }}</span>{% endif %}</div>
    </div>
  </header>
  <div class="content-section"><div class="shell prose">{{ content }}</div></div>
</article>
